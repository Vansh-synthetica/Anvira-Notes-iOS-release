<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https:; img-src 'self' data: blob: file: https: http:; media-src 'self' data: blob: file: https:; connect-src 'self' data: blob: https: wss: http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <!-- viewport-fit=cover here, not only from platform/install.ts: Android's WebView reads it when the page first shows
         to decide whether the app draws under the status and navigation bars (desktop browsers ignore it) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Anvira Notes</title>
    <meta name="theme-color" content="#1c1c1c" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- not render-blocking: offline (a phone on a plane) the page must not wait for the font server (switched on by boot.js) -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" media="print" id="font-dm-sans" />
    <script type="module" crossorigin src="/Anvira-Notes-iOS-release/assets/index-DQdceM2N.js"></script>
    <link rel="stylesheet" crossorigin href="/Anvira-Notes-iOS-release/assets/index-DwrWRYdr.css">
  </head>
  <body>
    <!-- The phone / tablet app's opening, after the system's plain graphite splash: "Anvira Notes" fades in at the
         centre, LOCALHOUSELLM comes in beneath it in thin, wide-spaced capitals, then both fade away once the app has
         drawn (window.__anviraBootDone, called by the touch shell). Only in the native app; the desktop never shows it. -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 2147483000; display: none; align-items: center; justify-content: center; background: #1c1c1c; font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
      html.boot #boot { display: flex; }
      #boot .stage { display: flex; flex-direction: column; align-items: center; }
      #boot .name { color: #f5f5f7; font-size: 30px; font-weight: 600; letter-spacing: -0.015em; animation: boot-in 900ms cubic-bezier(0.2, 0.7, 0.2, 1) 150ms both; }
      #boot .sub { margin-top: 14px; padding-left: 0.42em; color: #8e8e94; font-size: 11.5px; font-weight: 300; letter-spacing: 0.42em; animation: boot-sub 1000ms cubic-bezier(0.2, 0.7, 0.2, 1) 750ms both; }
      #boot.done { animation: boot-out 520ms cubic-bezier(0.4, 0, 0.2, 1) both; pointer-events: none; }
      #boot.done .stage { animation: boot-away 520ms cubic-bezier(0.4, 0, 0.2, 1) both; }
      @keyframes boot-in { from { opacity: 0; transform: translateY(6px); filter: blur(4px) } to { opacity: 1; transform: none; filter: none } }
      @keyframes boot-sub { from { opacity: 0; letter-spacing: 0.7em } to { opacity: 1; letter-spacing: 0.42em } }
      @keyframes boot-out { to { opacity: 0 } }
      @keyframes boot-away { to { opacity: 0; transform: translateY(-4px) } }
      @media (prefers-reduced-motion: reduce) { #boot *, #boot { animation-duration: 1ms !important; animation-delay: 0ms !important; } }
    </style>
    <div id="boot" aria-hidden="true">
      <div class="stage">
        <div class="name">Anvira Notes</div>
        <div class="sub">LOCALHOUSELLM</div>
      </div>
    </div>
    <!-- the opening and the font switch: a file, not inline (the Content-Security-Policy refuses inline scripts) -->
    <script src="./boot.js"></script>
    <div id="root"></div>
  </body>
</html>
